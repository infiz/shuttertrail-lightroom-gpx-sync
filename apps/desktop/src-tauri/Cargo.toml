[package]
name = "shuttertrail-geotagger"
version = "1.0.1"
description = "Write GPX locations directly into photo metadata"
authors = ["ShutterTrail"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "shuttertrail_geotagger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
quick-xml = "0.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
